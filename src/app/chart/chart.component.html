<div class="dd" style="justify-content: center; display: flex;flex-direction: column;align-items: center;">
    <select  [(ngModel)]="chartType" (change)="viewEChart()" >
      <option value="bar">Bar Chart</option>
      <option value="line">Line Chart</option>
      <option value="pie">Pie Chart</option>
      <option value="radar">Radar Chart</option>
      <option value="gauge">Gauge Chart</option>
    </select>
    <div id="main" style="width: 50%; height: 400px; display: flex; justify-content: center;border: 2px solid black; border-radius: 5px;margin-top: 10px;background-color: whitesmoke;"></div>

  </div>
